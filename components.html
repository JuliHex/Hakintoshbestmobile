<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Component Checker - Hackintosh Laptop Guide</title>
    <meta name="description" content="Check which CPUs, GPUs, Wi-Fi cards, RAM and SSDs work with macOS on a Hackintosh laptop.">
    <meta name="theme-color" content="#4A90E2">
    <script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div id="site-header"></div>

    <main id="main" class="page">
        <h1 class="page-title">Component Checker</h1>
        <p class="page-lead">A Hackintosh is only as good as its parts. Check the general macOS compatibility of each core component before you buy.</p>

        <div class="mt-4 flex flex-wrap gap-x-5 gap-y-2 text-sm text-gray-600 dark:text-gray-300">
            <span class="inline-flex items-center gap-2"><span class="status-dot good !mt-0"></span>Recommended</span>
            <span class="inline-flex items-center gap-2"><span class="status-dot mid !mt-0"></span>Works with effort</span>
            <span class="inline-flex items-center gap-2"><span class="status-dot bad !mt-0"></span>Avoid</span>
        </div>

        <div id="component-tabs" role="tablist" aria-label="Component categories" class="mt-6 flex gap-2 overflow-x-auto pb-2 -mx-4 px-4 sm:mx-0 sm:px-0 sm:flex-wrap"></div>
        <div id="component-content" role="tabpanel" class="mt-4"></div>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/components_page.js"></script>
</body>
</html>
