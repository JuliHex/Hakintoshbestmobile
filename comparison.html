<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compare Laptops - Hackintosh Laptop Guide</title>
    <meta name="description" content="Compare up to three Hackintosh laptops side by side.">
    <meta name="theme-color" content="#4A90E2">
    <script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
    <div id="site-header"></div>

    <main id="main" class="page">
        <h1 class="page-title">Compare laptops</h1>
        <p class="page-lead">Choose up to three laptops. Your picks are saved on this device, and the page link can be shared.</p>

        <div id="pickers" class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-3"></div>

        <div id="compare-empty" class="card p-8 mt-6 text-center" hidden>
            <p class="font-medium">Pick at least two laptops to compare.</p>
            <a href="explorer.html" class="btn-primary mt-4">Browse the Explorer</a>
        </div>

        <div id="compare-results" class="mt-6 space-y-6" hidden>
            <section class="card p-5">
                <h2 class="section-title">Ratings</h2>
                <div class="relative h-80 max-w-xl mx-auto"><canvas id="compare-chart" role="img" aria-label="Ratings radar chart"></canvas></div>
            </section>

            <section class="card p-0 overflow-hidden">
                <h2 class="section-title px-5 pt-5">Specifications</h2>
                <div class="table-scroll !mx-0">
                    <table id="compare-table"></table>
                </div>
            </section>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/comparison_page.js"></script>
</body>
</html>
