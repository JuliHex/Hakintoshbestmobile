<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Laptop Explorer - Hackintosh Laptop Guide</title>
    <meta name="description" content="Search and filter Hackintosh-compatible laptops by priority, macOS version and compatibility score.">
    <meta name="theme-color" content="#4A90E2">
    <script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div id="site-header"></div>

    <main id="main" class="page pb-28">
        <h1 class="page-title">Laptop Explorer</h1>
        <p class="page-lead">Filter by what matters to you, then tap <strong>+ Compare</strong> on up to three laptops to see them side by side.</p>

        <div class="mt-6 lg:grid lg:grid-cols-[17rem,1fr] lg:gap-8 lg:items-start">
            <aside class="lg:sticky lg:top-24">
                <div class="flex gap-2 lg:hidden">
                    <div class="relative flex-1">
                        <label for="search-input-mobile" class="sr-only">Search laptops</label>
                        <input type="search" id="search-input-mobile" class="input" placeholder="Search name, CPU, Wi-Fi…" data-search>
                    </div>
                    <button type="button" id="filters-toggle" class="btn-secondary shrink-0" aria-expanded="false" aria-controls="filters-panel">
                        Filters <span id="active-filter-count" class="tag" hidden></span>
                    </button>
                </div>

                <form id="filters-panel" class="card p-4 mt-3 lg:mt-0 space-y-5 hidden lg:block" onsubmit="return false">
                    <div class="hidden lg:block">
                        <label for="search-input" class="label">Search</label>
                        <input type="search" id="search-input" class="input" placeholder="Name, CPU, Wi-Fi…" data-search>
                    </div>

                    <div>
                        <label for="sort-select" class="label">Sort by</label>
                        <select id="sort-select" class="input">
                            <option value="score-desc">Score (high to low)</option>
                            <option value="score-asc">Score (low to high)</option>
                            <option value="name-asc">Name (A to Z)</option>
                            <option value="name-desc">Name (Z to A)</option>
                        </select>
                    </div>

                    <fieldset>
                        <legend class="label">Priorities</legend>
                        <div id="priority-filters" class="flex flex-wrap gap-2"></div>
                    </fieldset>

                    <fieldset>
                        <legend class="label">Runs macOS</legend>
                        <div id="macos-filters" class="flex flex-wrap gap-2"></div>
                    </fieldset>

                    <div>
                        <label for="brand-select" class="label">Brand</label>
                        <select id="brand-select" class="input">
                            <option value="">All brands</option>
                        </select>
                    </div>

                    <div>
                        <button type="button" id="favorites-only" class="chip w-full justify-center" aria-pressed="false">Favorites only</button>
                    </div>

                    <div>
                        <label for="min-score" class="label">Minimum score</label>
                        <select id="min-score" class="input">
                            <option value="0">Any</option>
                            <option value="7">7.0+</option>
                            <option value="8">8.0+</option>
                            <option value="8.5">8.5+</option>
                            <option value="9">9.0+</option>
                        </select>
                    </div>

                    <button type="button" id="reset-filters" class="btn-secondary w-full">Reset filters</button>
                </form>
            </aside>

            <section aria-labelledby="results-heading" class="mt-6 lg:mt-0">
                <h2 id="results-heading" class="sr-only">Results</h2>
                <p id="result-count" class="text-sm text-gray-600 dark:text-gray-400 mb-4" aria-live="polite"></p>
                <div id="laptop-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>
                <div id="no-results" class="card p-8 text-center" hidden>
                    <p class="font-medium">No laptops match these filters.</p>
                    <button type="button" class="btn-secondary mt-4" data-reset>Reset filters</button>
                </div>
            </section>
        </div>
    </main>

    <div id="compare-bar" class="fixed inset-x-0 z-30 h-16 pointer-events-none text-center" style="bottom: calc(0.75rem + env(safe-area-inset-bottom))"
         data-liquid-glass='{"padding": "0", "style": {"pointerEvents": "auto"}}' hidden>
        <div class="lg-surface pointer-events-auto inline-flex rounded-full pl-5 pr-2 py-2 items-center gap-2 text-left" style="width: min(42rem, calc(100vw - 1.5rem))">
            <p class="flex-1 min-w-0 text-sm">
                <strong id="compare-count"></strong>
                <span id="compare-names" class="hidden sm:inline text-gray-600 dark:text-gray-300"></span>
            </p>
            <button type="button" id="compare-clear" class="btn-secondary">Clear</button>
            <a href="comparison.html" id="compare-go" class="btn-primary">Compare</a>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/explorer_page.js"></script>
    <script src="assets/js/liquid-glass.js" defer></script>
</body>
</html>
